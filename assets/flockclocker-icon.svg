<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flock Clocker app icon — "Transparent Eye / aperture of oversight" (Direction A, production).
  Hand-authored vector. Reads as a camera-iris APERTURE DIAPHRAGM, not a bullseye/reticle:
  six rotationally-symmetric blade leaves, each bounded by an edge of a central hexagonal
  opening, two CANTED seams running out to the rim (26 deg clockwise spin = the diaphragm
  pinwheel), and the outer arc. The cant and the polygonal hex opening are what make it read
  as a folding camera aperture; there are no concentric closed rings anywhere, so it cannot
  read as a target/dartboard/crosshair. The central hexagonal opening is the H3 "bubble"
  motif (bubbles, not pins). One warm amber hex cell sits in the opening as the single accent.

  Color (OKLCH source, LVL color.md + LDS primitives.oklch.json; sRGB hex derived, no #000/#fff):
    field   civic blue   oklch(0.5134 0.1603 255.67)  ->  #1565C0   (LDS ai.stroke)
    depth   indigo edge  oklch(0.3821 0.1539 271.00)  ->  #283593   (LDS fts.stroke)
    blades  warm white   oklch(0.985  0.006  255   )  ->  #F7FAFE
    accent  warm amber   oklch(0.7171 0.1749 53.47 )  ->  #F57F17   (LDS data.stroke)
  No red. No text. Centered single figure, generous margin (figure within central ~66%).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Flock Clocker">
  <defs>
    <radialGradient id="field" cx="50%" cy="44%" r="74%">
      <stop offset="0%"  stop-color="#1B6FCB"/>
      <stop offset="60%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#114F9B"/>
    </radialGradient>
    <radialGradient id="well" cx="50%" cy="50%" r="60%">
      <stop offset="45%" stop-color="#114F9B"/>
      <stop offset="100%" stop-color="#0E417F"/>
    </radialGradient>
    <!-- Clip to the iris disc so the leaf arcs share one clean circular outer edge. -->
    <clipPath id="disc"><circle cx="512" cy="512" r="338"/></clipPath>
  </defs>

  <!-- Full-bleed civic-blue field (iOS + Android mask the corners). -->
  <rect width="1024" height="1024" fill="url(#field)"/>

  <!-- The aperture diaphragm: six warm-white blade leaves, clipped to the disc.
       Indigo seam strokes are the iris blade edges; the canted seams give the spin. -->
  <g clip-path="url(#disc)" fill="#F7FAFE" stroke="#283593" stroke-width="9" stroke-linejoin="round">
    <path d="M 512.00 354.00 L 660.17 208.21 A 338.00 338.00 0 0 1 849.18 488.42 L 648.83 433.00 Z"/>
    <path d="M 648.83 433.00 L 849.18 488.42 A 338.00 338.00 0 0 1 701.01 792.21 L 648.83 591.00 Z"/>
    <path d="M 648.83 591.00 L 701.01 792.21 A 338.00 338.00 0 0 1 363.83 815.79 L 512.00 670.00 Z"/>
    <path d="M 512.00 670.00 L 363.83 815.79 A 338.00 338.00 0 0 1 174.82 535.58 L 375.17 591.00 Z"/>
    <path d="M 375.17 591.00 L 174.82 535.58 A 338.00 338.00 0 0 1 322.99 231.79 L 375.17 433.00 Z"/>
    <path d="M 375.17 433.00 L 322.99 231.79 A 338.00 338.00 0 0 1 660.17 208.21 L 512.00 354.00 Z"/>
  </g>

  <!-- Crisp outer rim of the iris assembly (single edge, not a concentric ring system). -->
  <circle cx="512" cy="512" r="338" fill="none" stroke="#283593" stroke-width="10"/>

  <!-- Central hexagonal opening: the field shows through (the aperture "pupil" / H3 bubble). -->
  <path d="M 512.00 354.00 L 648.83 433.00 L 648.83 591.00 L 512.00 670.00 L 375.17 591.00 L 375.17 433.00 Z"
        fill="url(#well)" stroke="#283593" stroke-width="9" stroke-linejoin="round"/>

  <!-- Single amber accent: a small filled hex cell centered in the opening (deployed-marker hue). -->
  <path d="M 512.00 442.00 L 572.62 477.00 L 572.62 547.00 L 512.00 582.00 L 451.38 547.00 L 451.38 477.00 Z"
        fill="#F57F17"/>
</svg>
